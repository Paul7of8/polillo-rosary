<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Rosary</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rosary">
  <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#110f0e" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261011061442">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=20261011061442">
  <script>
    // Apply a saved theme before first paint.
    try {
      var t = localStorage.getItem("rosary-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css?v=20261011061442">
</head>
<body>
  <header class="topbar">
    <p class="topbar-title" id="topbar-title"></p>
    <button class="icon-button" id="settings-open" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>
      </svg>
    </button>
  </header>

  <main id="screen" tabindex="-1"></main>

  <nav class="nav" aria-label="Rosary sections">
    <button class="nav-button" id="back" type="button">Back</button>
    <ol class="dots" id="dots" aria-hidden="true"></ol>
    <button class="nav-button nav-next" id="next" type="button">Next</button>
  </nav>

  <dialog class="sheet" id="settings">
    <form method="dialog">
      <fieldset>
        <legend>Mysteries</legend>
        <div class="choices" id="mystery-choices"></div>
      </fieldset>
      <fieldset>
        <legend>Appearance</legend>
        <div class="choices" id="theme-choices"></div>
      </fieldset>
      <button class="sheet-action" id="restart" type="button">Start over</button>
      <button class="sheet-action sheet-done" type="submit">Done</button>
    </form>
  </dialog>

  <script src="js/data/prayers.js?v=20261011061442"></script>
  <script src="js/data/mysteries.js?v=20261011061442"></script>
  <script src="js/data/images.js?v=20261011061442"></script>
  <script src="js/calendar.js?v=20261011061442"></script>
  <script src="js/app.js?v=20261011061442"></script>
</body>
</html>
